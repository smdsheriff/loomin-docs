name: Feature Request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [Roadmap](../blob/main/README.md#roadmap) first — the change you
        want may already be planned, in which case comment there instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're stuck in, not the solution you have in mind.
      placeholder: |
        I have a 400-page manual. Retrieval pulls in chunks that mention my keywords
        but answer a different question, so responses cite the wrong section.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor / UI
        - AI assistant and RAG quality
        - File handling and ingestion
        - Deployment and air-gapped tooling
        - Security and privacy
        - Testing and CI
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to work on this myself.
